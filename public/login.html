<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Aura Blog account to write and comment on posts.">
  <title>Login | Aura Blog</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="container">
    <nav class="navbar glass">
      <a href="index.html" class="logo">
        AURA<span class="logo-dot"></span>BLOG
      </a>
      <ul class="nav-links" id="navbar-auth-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="login.html" class="btn btn-secondary active">Login</a></li>
        <li><a href="register.html" class="btn btn-primary">Sign Up</a></li>
      </ul>
    </nav>
  </header>

  <!-- Login Card Section -->
  <main class="container auth-wrapper">
    <div class="auth-card glass">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Sign in to join the conversation and write articles</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="name@domain.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary auth-btn">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one here</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 Aura Blog. Built with passion by <a href="#">Antigravity</a>.</p>
    </div>
  </footer>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
