<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Share your stories, write posts and discuss in the comments on our modern glassmorphic blog platform.">
  <title>Aura Blog | Share Your Story</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="container">
    <nav class="navbar glass">
      <a href="index.html" class="logo">
        AURA<span class="logo-dot"></span>BLOG
      </a>
      <ul class="nav-links" id="navbar-auth-links">
        <!-- Auth Links will render dynamically from api.js -->
        <li><a href="index.html" class="nav-link active">Home</a></li>
        <li><a href="login.html" class="btn btn-secondary">Login</a></li>
        <li><a href="register.html" class="btn btn-primary">Sign Up</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Banner -->
  <section class="container hero">
    <h1>Welcome to <span>Aura Blog</span></h1>
    <p>A minimalist space for developers, designers, and creatives to publish, read, and converse without noise.</p>
  </section>

  <!-- Filter & Search Controls -->
  <main class="container">
    <div class="controls-bar glass">
      <div class="search-box">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.604 10.604z" />
        </svg>
        <input type="text" id="search-input" placeholder="Search articles by title or keywords...">
      </div>
      <div class="tags-filter" id="tags-filter">
        <!-- Tags rendered dynamically -->
      </div>
    </div>

    <!-- Posts Grid -->
    <div class="posts-grid" id="posts-grid">
      <!-- Loading indicator initially, posts rendered dynamically -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 Aura Blog. Built with passion by <a href="#">Antigravity</a>.</p>
    </div>
  </footer>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
